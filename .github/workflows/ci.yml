name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, evaluate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Evidence validators resolve recorded historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Record full dependency audit
        id: full-audit
        continue-on-error: true
        run: npm audit --json > dependency-audit.json
      - name: Preserve full audit report
        if: always() && steps.full-audit.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Run automated tests
        run: npm test
      - name: Evaluate instruction contracts
        run: npm run eval:instructions
      - name: Build Studio
        run: npm run build
